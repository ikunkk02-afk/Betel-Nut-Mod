name: NeoForge build and gameplay tests
on: [push, pull_request]
permissions:
 contents: read
jobs:
 build:
  runs-on: ubuntu-latest
  timeout-minutes: 40
  strategy:
   fail-fast: false
   matrix:
    environment: [core, create, compat]
  steps:
   - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
   - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
     with:
      java-version: '21'
      distribution: temurin
   - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
   - run: chmod +x gradlew
   - name: Gameplay tests
     shell: bash
     run: |
      args=""
      if [ "${{ matrix.environment }}" = "compat" ]; then args="-PcompatMods"; fi
      if [ "${{ matrix.environment }}" = "create" ]; then args="-PcreateOnly"; fi
      ./gradlew -PportTests $args runGameTestServer --console=plain | tee gametests.log
      grep -q 'All 138 required tests passed' gametests.log
   - name: Build release
     run: ./gradlew build
   - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
     if: always()
     with:
      name: neoforge-${{ matrix.environment }}
      if-no-files-found: error
      path: |
       build/libs/*.jar
       gametests.log
