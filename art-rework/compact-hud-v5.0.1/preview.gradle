// Isolated visual regression client. Excluded from both release JARs.
sourceSets {
    compactHudPreview {
        java.srcDir 'art-rework/compact-hud-v5.0.1/dev/java'
        resources.srcDir 'art-rework/compact-hud-v5.0.1/dev/resources'
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output + sourceSets.client.compileClasspath + sourceSets.client.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.client.runtimeClasspath
    }
}
loom {
    mods { betel_compact_hud_preview { sourceSet sourceSets.compactHudPreview } }
    runs {
        compactHudPreviewClient {
            client()
            source sourceSets.compactHudPreview
            runDir 'art-rework/compact-hud-v5.0.1/client-run'
            programArgs '--quickPlaySingleplayer', 'CompactHudPreview', '--width', '1600', '--height', '1000'
        }
    }
}
