// Isolated real-client regression. Excluded from release JARs.
sourceSets {
    dailyPenaltiesPreview {
        java.srcDir 'art-rework/daily-penalties-v5.0.2/dev/java'
        resources.srcDir 'art-rework/daily-penalties-v5.0.2/dev/resources'
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output + sourceSets.client.compileClasspath + sourceSets.client.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.client.runtimeClasspath
    }
}
loom {
    mods { betel_daily_penalties_preview { sourceSet sourceSets.dailyPenaltiesPreview } }
    runs {
        dailyPenaltiesPreviewClient {
            client()
            source sourceSets.dailyPenaltiesPreview
            runDir 'art-rework/daily-penalties-v5.0.2/client-run'
            programArgs '--quickPlaySingleplayer', 'DailyPenaltiesPreview', '--width', '1600', '--height', '1000'
        }
    }
}
