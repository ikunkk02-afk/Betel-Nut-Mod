// Isolated, optional client verification. Never bundled in release JARs.
sourceSets {
    effectsPreview {
        java.srcDir 'art-rework/effects-v5.5.0/dev/java'
        resources.srcDir 'art-rework/effects-v5.5.0/dev/resources'
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output + sourceSets.client.compileClasspath + sourceSets.client.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.client.runtimeClasspath
    }
}
loom {
    mods { betel_effects_preview { sourceSet sourceSets.effectsPreview } }
    runs {
        effectsPreviewClient {
            client()
            source sourceSets.effectsPreview
            runDir 'art-rework/effects-v5.5.0/client-run'
            programArgs '--quickPlaySingleplayer', 'EffectsPreview', '--width', '1600', '--height', '1000'
        }
    }
}
