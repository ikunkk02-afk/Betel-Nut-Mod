// Isolated development client; never included in release or source JARs.
sourceSets {
    featuresPreview {
        java.srcDir 'art-rework/features-v5/dev/java'
        resources.srcDir 'art-rework/features-v5/dev/resources'
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output + sourceSets.client.compileClasspath + sourceSets.client.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.client.runtimeClasspath
    }
}
loom {
    mods { betel_features_preview { sourceSet sourceSets.featuresPreview } }
    runs {
        featuresPreviewClient {
            client()
            source sourceSets.featuresPreview
            runDir 'art-rework/features-v5/client-run'
            programArgs '--quickPlaySingleplayer', 'FeaturesPreview', '--width', '1600', '--height', '1000'
        }
    }
}
