// Isolated real-client fruit verification. Excluded from release artifacts.
sourceSets {
    fruitPreview {
        java.srcDir 'art-rework/fruit-v5.3.0/dev/java'
        resources.srcDir 'art-rework/fruit-v5.3.0/dev/resources'
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output + sourceSets.client.compileClasspath + sourceSets.client.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.client.runtimeClasspath
    }
}
loom {
    mods { betel_fruit_preview { sourceSet sourceSets.fruitPreview } }
    runs {
        fruitPreviewClient {
            client()
            source sourceSets.fruitPreview
            runDir 'art-rework/fruit-v5.3.0/client-run'
            programArgs '--quickPlaySingleplayer', 'FruitPreview', '--width', '1600', '--height', '1000'
        }
    }
}
