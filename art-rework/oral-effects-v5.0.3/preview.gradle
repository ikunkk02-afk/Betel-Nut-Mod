// Isolated real-client regression. Excluded from release JARs.
sourceSets {
    oralEffectsPreview {
        java.srcDir 'art-rework/oral-effects-v5.0.3/dev/java'
        resources.srcDir 'art-rework/oral-effects-v5.0.3/dev/resources'
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output + sourceSets.client.compileClasspath + sourceSets.client.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.client.runtimeClasspath
    }
}
loom {
    mods { betel_oral_effects_preview { sourceSet sourceSets.oralEffectsPreview } }
    runs {
        oralEffectsPreviewClient {
            client()
            source sourceSets.oralEffectsPreview
            runDir 'art-rework/oral-effects-v5.0.3/client-run'
            programArgs '--quickPlaySingleplayer', 'OralEffectsPreview', '--width', '1600', '--height', '1000'
        }
    }
}
