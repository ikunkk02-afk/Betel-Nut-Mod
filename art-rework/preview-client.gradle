// Development-only client: absent from both the release JAR and sources JAR.
def previewWorld = project.hasProperty('grovePreview') ? 'ArecaNaturalPalmsGroundFix' : 'ArecaPreview'
sourceSets {
    artPreview {
        java.srcDir 'art-rework/client-preview/java'
        resources.srcDir 'art-rework/client-preview/resources'
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output + sourceSets.client.compileClasspath + sourceSets.client.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.client.runtimeClasspath
    }
}
loom {
    mods {
        betel_art_preview { sourceSet sourceSets.artPreview }
    }
    runs {
        artPreviewClient {
            client()
            source sourceSets.artPreview
            runDir 'art-rework/client-run'
            programArgs '--quickPlaySingleplayer', previewWorld, '--width', '1440', '--height', '900'
        }
    }
}
