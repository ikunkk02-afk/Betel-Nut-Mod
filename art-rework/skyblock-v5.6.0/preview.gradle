// Optional, isolated client smoke test; never included in release JARs.
sourceSets {
    skyblockPreview {
        java.srcDir 'art-rework/skyblock-v5.6.0/dev/java'
        resources.srcDir 'art-rework/skyblock-v5.6.0/dev/resources'
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output + sourceSets.client.compileClasspath + sourceSets.client.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.client.runtimeClasspath
    }
}
loom {
    mods { betel_skyblock_preview { sourceSet sourceSets.skyblockPreview } }
    runs {
        skyblockPreviewClient {
            client()
            source sourceSets.skyblockPreview
            runDir 'art-rework/skyblock-v5.6.0/client-run'
            property 'betel.skyblock.guideOnly', project.hasProperty('skyblockGuideOnly').toString()
            property 'betel.skyblock.mobOnly', project.hasProperty('skyblockMobPreview').toString()
            programArgs '--quickPlaySingleplayer', 'SkyblockClassic', '--width', '1600', '--height', '1000'
        }
    }
}
