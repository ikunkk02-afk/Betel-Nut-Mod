plugins {
 id 'java-library'
 id 'maven-publish'
 id 'net.neoforged.moddev' version '2.0.148'
}
version = mod_version
group = mod_group_id
base.archivesName = 'betel-nut-mod-neoforge'
java { toolchain.languageVersion = JavaLanguageVersion.of(21); withSourcesJar() }
repositories {
 maven { url = 'https://api.modrinth.com/maven' }
 maven { url = 'https://maven.createmod.net'; content { includeGroup 'net.createmod.ponder' } }
}
sourceSets { gametest { compileClasspath += main.output; runtimeClasspath += main.output } }
configurations {
 gametestImplementation.extendsFrom implementation
 gametestRuntimeOnly.extendsFrom runtimeOnly
}
dependencies {
 gametestCompileOnly 'maven.modrinth:R2OftAxM:XTVZDOol'
 gametestCompileOnly 'maven.modrinth:LNytGWDc:UjX6dr61'
 gametestCompileOnly('net.createmod.ponder:ponder-neoforge:1.0.82+mc1.21.1') { transitive = false }
 if (project.hasProperty('createOnly')) runtimeOnly 'maven.modrinth:LNytGWDc:UjX6dr61'
 if (project.hasProperty('compatMods')) {
  runtimeOnly 'maven.modrinth:LNytGWDc:UjX6dr61'
  runtimeOnly 'maven.modrinth:R2OftAxM:XTVZDOol'
 }
 implementation 'maven.modrinth:midnightlib:1.9.2+1.21.1-neoforge'
 jarJar('maven.modrinth:midnightlib:1.9.2+1.21.1-neoforge') {
  version { strictly '[1.9.2+1.21.1-neoforge,1.10)'; prefer '1.9.2+1.21.1-neoforge' }
 }
}
neoForge {
 version = project.neo_version
 parchment { mappingsVersion = project.parchment_mappings_version; minecraftVersion = project.parchment_minecraft_version }
 addModdingDependenciesTo(sourceSets.gametest)
 mods {
  create(project.mod_id) {
   sourceSet sourceSets.main
   if (project.hasProperty('portTests')) sourceSet sourceSets.gametest
  }
 }
 runs {
  client { client() }
  portSmoke {
   client()
   sourceSet = sourceSets.gametest
   gameDirectory = file(project.findProperty('portSmokeDir') ?: 'run-client-port')
   systemProperty 'betel.portSmoke', 'true'
   programArguments.addAll '--width', '1440', '--height', '900', '--username', 'PortSmoke'
  }
  server { server(); programArgument '--nogui' }
  naturalProbe {
   server()
   sourceSet = sourceSets.gametest
   gameDirectory = file('run-worldgen-port')
   systemProperty 'betel.worldgenProbe', 'true'
   jvmArgument '-Xmx3G'
   programArgument '--nogui'
  }
  gameTestServer {
   type = 'gameTestServer'
   sourceSet = sourceSets.gametest
   systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
  }
  configureEach { logLevel = org.slf4j.event.Level.INFO }
 }
}
var metadata = tasks.register('generateModMetadata', ProcessResources) {
 var props = [mod_id:mod_id, mod_version:mod_version, neo_version:neo_version]
 inputs.properties props
 expand props
 from 'src/main/templates'
 into 'build/generated/modMetadata'
}
sourceSets.main.resources.srcDir metadata
neoForge.ideSyncTask metadata
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 21 }
jar { from('LICENSE') }
publishing { publications { mavenJava(MavenPublication) { from components.java } } }
